name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests (physics, scoring, determinism, data)
        run: npm test
      - name: Campaign bot (all 50 levels, timing margins)
        run: npm run bot -- --silent=false
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke test on the built game
        run: npm run test:e2e
