<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Skoki i fikoły</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1b2a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,12,24,.62);backdrop-filter:blur(3px)}
#panel{width:min(640px,calc(100vw - 32px));padding:24px 26px;background:rgba(14,24,44,.95);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box}
h1{margin:0 0 4px;font-size:28px}
h2{margin:18px 0 6px;font-size:15px;color:#ffd166;font-weight:700}
.sub{margin:0 0 14px;color:#9fb3cc;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td{padding:4px 6px;vertical-align:top;border-top:1px solid rgba(255,255,255,.07)}
td:first-child{white-space:nowrap;width:1%;padding-right:14px}
kbd{display:inline-block;min-width:18px;padding:1px 6px;border-radius:6px;background:#22324f;border:1px solid #3a4f75;border-bottom-width:3px;font:600 12.5px system-ui,sans-serif;text-align:center;color:#fff}
.note{margin:12px 0 0;font-size:13px;color:#c6d3e3;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.primary{margin-top:14px;width:100%;padding:13px;font-weight:700;font-size:17px;color:#0d1b2a;background:#ffd166;border:0;border-radius:10px}
.primary:hover{background:#ffe08f}
.mb{display:block;width:100%;margin:8px 0;padding:13px 16px;text-align:left;color:#fff;background:#1b2a47;border:1px solid #33496f;border-radius:12px}
.mb:hover{background:#24385e;border-color:#4e6ea3}
.mb b{display:block;font-size:17px}
.mb span{display:block;margin-top:2px;font-size:13px;color:#9fb3cc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:10px}
.lv{padding:8px 4px 7px;border-radius:10px;background:#1b2a47;border:1px solid #33496f;color:#fff;font-weight:800;font-size:16px;text-align:center}
.lv:hover:not(:disabled){background:#24385e;border-color:#4e6ea3}
.lv small{display:block;font-weight:500;font-size:11px;color:#9fb3cc;margin-top:1px}
.lv .st{display:block;color:#ffd166;font-size:12px;letter-spacing:1px;margin-top:2px}
.lv:disabled{opacity:.33;cursor:not-allowed}
.row{display:flex;gap:8px}
.row .mb{flex:1;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div id="panel"></div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),panel=document.getElementById('panel');
const TAU=Math.PI*2,G=9.81;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,wrap=a=>a-TAU*Math.round(a/TAU),rand=(a,b)=>a+Math.random()*(b-a);
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
let VW,VH,DPR;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);}
addEventListener('resize',resize);resize();
function load(k){try{return parseFloat(localStorage.getItem(k))||0}catch(e){return 0}}
function save(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}

/* ================= input ================= */
const keys={};let lmb=false,rmb=false,mouseX=0,mouseOn=false,paused=true,screen='menu',game=null;
const GAME_KEYS=['KeyW','KeyA','KeyS','KeyD','Space','KeyE','KeyR'];
function clearInput(){for(const k in keys)keys[k]=false;lmb=rmb=false;}
addEventListener('keydown',e=>{
  if(GAME_KEYS.includes(e.code))e.preventDefault();
  if(e.code==='Escape'){if(screen==='play')showPause();else if(screen==='pause')resume();else if(screen==='levels')showMenu();return;}
  if(screen!=='play'){if(e.code==='Enter'&&screen==='pause')resume();return;}
  if(e.code==='KeyM'&&!e.repeat){muted=!muted;return;}
  const fresh=!keys[e.code];keys[e.code]=true;
  if(fresh&&!e.repeat&&game&&game.onKey)game.onKey(e.code);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('mousedown',e=>{ac();if(screen!=='play')return;if(e.button===0)lmb=true;if(e.button===2)rmb=true;if(game&&game.onClick)game.onClick(e.button);e.preventDefault();});
addEventListener('mouseup',e=>{if(e.button===0)lmb=false;if(e.button===2)rmb=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{mouseX=e.clientX;mouseOn=true;});
addEventListener('blur',()=>{clearInput();if(screen==='play')showPause();});

/* ================= audio ================= */
let AC=null,muted=false;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f0,f1,dur,type,vol,delay){const a=AC;if(!a||muted)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);}
function noise(dur,type,freq,vol){const a=AC;if(!a||muted)return;const len=(dur*a.sampleRate)|0,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
function boing(v){const s=Math.min(1,v/14);tone(110+s*60,240+s*220,0.24,'sine',0.07+0.1*s);}
function ding(lv){const n=[523,659,784,1047,1319,1568];const c=Math.min(6,2+Math.floor(lv));for(let i=0;i<c;i++)tone(n[i],n[i]*1.01,0.2,'triangle',0.07,i*0.07);}
function thud(){noise(0.28,'lowpass',360,0.55);tone(120,45,0.28,'sine',0.25);}
function splashSnd(v){noise(0.35+v*0.05,'bandpass',700+v*60,0.12+Math.min(0.5,v*0.06));}
function tick(){tone(900,700,0.05,'square',0.03);}

/* ================= shared drawing ================= */
const P_UP={knee:[0.02,-0.5],foot:[0,-0.98],sh:[0,0.55],head:[0.01,0.77],el:[0.04,0.85],ha:[0.07,1.13]};
const P_DN={knee:[0.03,-0.5],foot:[0,-0.98],sh:[0.02,0.55],head:[0.03,0.77],el:[0.15,0.29],ha:[0.3,0.06]};
const P_TUCK={knee:[0.42,0.22],foot:[0.13,-0.2],sh:[0.18,0.5],head:[0.3,0.68],el:[0.36,0.3],ha:[0.32,0.05]};
const P_PIKE={knee:[0.47,-0.06],foot:[0.95,-0.12],sh:[0.2,0.5],head:[0.31,0.67],el:[0.44,0.33],ha:[0.68,0.16]};
const P_CROUCH={knee:[0.3,-0.4],foot:[0.02,-0.74],sh:[0.14,0.52],head:[0.2,0.73],el:[-0.12,0.3],ha:[-0.24,0.1]};
const PAL_T={skin:'#f0bf98',skinD:'#d9a47e',top:'#d62f3c',bottom:'#1d3f75',bottomD:'#16325c',hair:'#3a2416',foot:'#ffffff',footD:'#d8dde6',stripe:'#ff6b6b',shortLen:0.45};
const PAL_D={skin:'#f0bf98',skinD:'#d9a47e',top:null,bottom:'#c1121f',bottomD:'#8d0e17',hair:'#3a2416',foot:'#f0bf98',footD:'#d9a47e',stripe:null,shortLen:0.26};
const PAL_P={skin:'#d9a27a',skinD:'#bd875f',top:null,bottom:'#0a84c6',bottomD:'#06608f',hair:'#121212',foot:'#d9a27a',footD:'#bd875f',stripe:null,shortLen:0.26};
function mixP(A,B,t){if(t<=0)return A;const o={};for(const k in A)o[k]=[lerp(A[k][0],B[k][0],t),lerp(A[k][1],B[k][1],t)];return o;}
function limb(pts,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();}
function drawBody(b,alpha,sx,sy,sc,pal){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(sx,sy);ctx.scale(sc,-sc);ctx.rotate(b.a);
  const c=Math.cos(b.tw);ctx.scale((c<0?-1:1)*Math.max(Math.abs(c),0.24),1);
  const st=b.strad*(1-b.tuck);let q=mixP(mixP(P_DN,P_UP,b.arm),P_PIKE,st);q=mixP(q,P_TUCK,b.tuck);q=mixP(q,P_CROUCH,b.crouch||0);
  ctx.translate(-0.16*b.tuck-0.14*st,-0.18*b.tuck);
  ctx.lineCap='round';ctx.lineJoin='round';
  const hip=[0,0],o=[-0.045,0.005],sl=pal.shortLen;
  const bk=q.knee.map((v,i)=>v+o[i]),bf=q.foot.map((v,i)=>v+o[i]*1.2);
  limb([hip,bk,bf],0.11,pal.skinD);limb([hip,[bk[0]*sl,bk[1]*sl]],0.15,pal.bottomD);
  ctx.fillStyle=pal.footD;ctx.beginPath();ctx.arc(bf[0],bf[1],0.05,0,TAU);ctx.fill();
  limb([q.sh,[q.el[0]-0.05,q.el[1]-0.02],[q.ha[0]-0.06,q.ha[1]-0.03]],0.072,pal.skinD);
  limb([hip,q.sh],0.21,pal.top||pal.skin);
  limb([[q.sh[0]*0.95,q.sh[1]*0.95],[q.sh[0]*0.6+q.head[0]*0.4,q.sh[1]*0.6+q.head[1]*0.4]],0.07,pal.skin);
  limb([hip,q.knee,q.foot],0.115,pal.skin);limb([hip,[q.knee[0]*sl,q.knee[1]*sl]],0.155,pal.bottom);
  if(!pal.top)limb([[0,-0.02],[0,0.03]],0.205,pal.bottom);
  ctx.fillStyle=pal.foot;ctx.beginPath();ctx.arc(q.foot[0],q.foot[1],0.052,0,TAU);ctx.fill();
  if(pal.stripe){ctx.fillStyle=pal.stripe;ctx.fillRect(-0.105,0.2,0.21,0.06);}
  const h=q.head;ctx.fillStyle=pal.skin;ctx.beginPath();ctx.arc(h[0],h[1],0.115,0,TAU);ctx.fill();
  ctx.fillStyle=pal.hair;ctx.beginPath();ctx.moveTo(h[0],h[1]);ctx.arc(h[0],h[1],0.125,0.3*Math.PI,1.15*Math.PI);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1b1b1b';ctx.beginPath();ctx.arc(h[0]+0.06,h[1]+0.02,0.017,0,TAU);ctx.fill();
  limb([q.sh,q.el,q.ha],0.075,pal.skin);
  ctx.restore();
}
function txt(s,x,y,size,color,align,weight){ctx.font=`${weight||700} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;ctx.textAlign=align||'left';ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillText(s,x+1.5,y+1.5);ctx.fillStyle=color;ctx.fillText(s,x,y);}
function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mixC(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`;}
const pops=[];
function popup(name,desc,sub,color,life){pops.unshift({name,desc,sub,color,t:0,life:life||2.2});if(pops.length>3)pops.length=3;}
function updatePops(dt){for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>pops[i].life)pops.splice(i,1);}}
function drawPops(cx,y){
  pops.forEach((q,i)=>{const a=q.t<0.15?q.t/0.15:1-Math.max(0,(q.t-q.life+0.5)/0.5);
    ctx.save();ctx.globalAlpha=Math.max(0,a)*(i===0?1:0.55);const sc=i===0?1:0.7,pop=i===0?1+Math.max(0,0.15-q.t)*1.5:1;
    txt(q.name,cx,y,Math.round(34*sc*pop),q.color,'center',800);
    let yy=y+22*sc;if(q.desc){txt(q.desc,cx,yy,Math.round(15*sc),'rgba(255,255,255,.9)','center',600);yy+=20*sc;}
    if(q.sub)txt(q.sub,cx,yy,Math.round(15*sc),'rgba(255,255,255,.85)','center',600);
    ctx.restore();y+=(q.desc?78:60)*sc;});
}

/* ================= TRAMPOLINA ================= */
const Tramp=(()=>{
const K=330,H0=1.0,HALF=2.1,FLOOR=-1.0;
let S=50,matY0=500;
function layout(){S=Math.min(VH/10,VW/8.5);matY0=VH-1.55*S;}
const X=x=>VW/2+x*S, Y=y=>matY0-(y-camY)*S, Yp=(y,p)=>matY0-(y-camY*p)*S;
const p={x:0,y:H0-G/K,vx:0,vy:0,a:0,L:0,tw:0,twRate:0,twTarget:null,tuck:0,strad:0,arm:0};
let contact=true,over=false,mode='play',modeT=0,crashTarget=0,jump=null;
let score=0,combo=0,lastTrick='',best=load('tramp_best'),bestH=load('tramp_bestH');
let camY=0,matD=G/K,matV=0,matX=0,shake=0,trailT=0;
const trail=[],parts=[];
function enter(){Object.assign(p,{x:0,y:H0-G/K,vx:0,vy:0,a:0,L:0,tw:0,twRate:0,twTarget:null,tuck:0,strad:0,arm:0});
  contact=true;over=false;mode='play';jump=null;score=0;combo=0;lastTrick='';camY=0;matD=G/K;matV=0;matX=0;trail.length=0;parts.length=0;pops.length=0;}
function twCount(h){if(h===1)return 'pół śruby';if(h===2)return 'śruba';const n=h/2,s=String(n).replace('.',',');if(h%2)return s+' śruby';return s+(n>=5?' śrub':' śruby');}
function trickInfo(f,h,dir,tuck,strad){
  if(f===0){
    if(h){const t=twCount(h);return{name:t[0].toUpperCase()+t.slice(1),desc:'skok ze śrubą',poseMul:1};}
    if(strad)return{name:'Szczupak',desc:'skok łamany',poseMul:1};
    if(tuck)return{name:'Kuczka',desc:'skok kuczny',poseMul:1};
    return null;
  }
  const pose=tuck?'kuczne':strad?'łamane':'proste';
  const poseMul=tuck?1:strad?1.15:1.3;
  const mult=['','','Podwójne','Potrójne','Poczwórne','Pięciokrotne','Sześciokrotne'][f]||(f+'-krotne');
  let base=(f===1?'Salto':mult+' salto')+' w '+(dir==='back'?'tył':'przód')+' '+pose;
  const spec=dir==='back'?{'1,2':'Full','1,4':'Double Full','1,6':'Triple Full','2,4':'Full-full'}:{'1,1':'Barani','1,3':'Rudy','1,5':'Randy'};
  const sp=spec[f+','+h];
  if(h)base+=' + '+twCount(h);
  return sp?{name:sp,desc:base,poseMul}:{name:base,desc:'',poseMul};
}
function burst(x,y,n,color,sp,size){for(let i=0;i<n;i++){const a=rand(Math.PI*0.05,Math.PI*0.95),v=rand(0.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*v*(Math.random()<.5?-1:1),vy:Math.sin(a)*v,life:rand(0.4,0.9),max:0.9,color,size:size*rand(0.6,1.2)});}}
function takeoff(){
  if(mode!=='play'){jump=null;return;}
  p.a=wrap(p.a);
  jump={a0:p.a,tw0:p.tw,f0:Math.cos(p.tw)>=0?1:-1,apex:0,tuckUsed:false,stradUsed:false};
  if(p.vy<1){p.vx=0;return;}
  const T=Math.max(0.25,2*p.vy/G);
  const tx=mouseOn?clamp((mouseX-VW/2)/S,-HALF-2.5,HALF+2.5):0;
  p.vx=clamp((tx-p.x)/T,-3,3);
  matV=-p.vy*0.25;
  if(p.vy>1.5)boing(p.vy);
}
function crash(msg){
  mode='crash';modeT=1.4;const w=wrap(p.a);p.a=w;crashTarget=(w>=0?1:-1)*Math.PI/2;
  p.L=0;p.tw=Math.round(p.tw/Math.PI)*Math.PI;p.twRate=0;p.twTarget=null;
  combo=0;lastTrick='';popup(msg,'','Combo przepadło','#ff6b6b');thud();shake=0.35;
  burst(p.x,-Math.max(0,matD)+0.05,18,'rgba(230,220,200,.9)',3.5,0.05);
}
function land(){
  if(mode!=='play'||!jump){jump=null;return;}
  const j=jump;jump=null;
  const w=wrap(p.a),err=Math.abs(w),impact=-p.vy;
  if(p.tuck>0.55){crash('Nie otworzyłeś się!');return;}
  if(err>0.8){crash(err>2.3?'Na głowę!':'Gleba!');return;}
  const total=p.a-j.a0;
  p.tw=Math.round(p.tw/Math.PI)*Math.PI;p.twRate=0;p.twTarget=null;
  const flips=Math.round(Math.abs(total)/TAU),half=Math.round(Math.abs(p.tw-j.tw0)/Math.PI);
  const dir=total*j.f0>0?'back':'front';
  p.a=w;p.L=0;
  let hRec=false;if(j.apex>bestH+0.05){bestH=j.apex;save('tramp_bestH',bestH.toFixed(2));hRec=j.apex>1;}
  if(impact>2)burst(p.x,0.02,8,'rgba(255,255,255,.7)',2,0.035);
  const info=trickInfo(flips,half,dir,j.tuckUsed,j.stradUsed);
  if(!info){if(hRec)popup('Rekord wysokości',`${bestH.toFixed(1)} m`,'','#8ecae6');return;}
  let base=(flips===0&&half===0)?(j.stradUsed?45:30):(flips*100*(1+0.4*(flips-1))+half*55+flips*half*30)*info.poseMul;
  base*=1+Math.max(0,j.apex-2)*0.05;
  let q,qm,qc;
  if(err<0.12){q='Perfekcyjne';qm=1.5;qc='#ffd166';}
  else if(err<0.35){q='Czyste';qm=1;qc='#9be7a7';}
  else{q='Chwiejne';qm=0.6;qc='#f4a261';}
  const full=info.name+'|'+info.desc,rep=full===lastTrick;if(rep)base*=0.5;
  combo++;const cm=Math.min(5,1+0.25*(combo-1));
  const pts=Math.round(base*qm*cm);score+=pts;lastTrick=full;
  if(score>best){best=score;save('tramp_best',best);}
  let sub=`${q} · +${pts}`;if(combo>1)sub+=` · combo ×${cm.toFixed(2)}`;if(rep)sub+=' · powtórka ×0,5';if(hRec)sub+=` · rekord ${bestH.toFixed(1)} m`;
  popup(info.name,info.desc,sub,qc);
  ding(flips+half/2);
  if(qm>=1.5)burst(p.x,0.1,26,'#ffd166',4.5,0.045);
}
function landFloor(){
  over=false;mode='out';modeT=1.8;p.y=FLOOR+H0;p.vy=0;p.vx=0;const w=wrap(p.a);p.a=w;crashTarget=(w>=0?1:-1)*Math.PI/2;
  p.L=0;p.twRate=0;p.twTarget=null;p.tw=Math.round(p.tw/Math.PI)*Math.PI;
  combo=0;lastTrick='';jump=null;popup('Za burtą!','','Trzymaj celownik nad siatką','#ff6b6b');thud();shake=0.45;
  burst(p.x,FLOOR+0.05,22,'rgba(120,90,60,.9)',3.5,0.05);
}
function respawn(){p.x=0;p.y=H0+1.6;p.vx=0;p.vy=0;p.a=0;p.L=0;mode='play';contact=false;over=false;
  jump={a0:0,tw0:p.tw,f0:Math.cos(p.tw)>=0?1:-1,apex:1.6,tuckUsed:false,stradUsed:false};}
function inertia(){return 1-0.55*p.tuck-0.3*p.strad*(1-p.tuck);}
function step(dt){
  if(mode==='out')return;
  const feet=p.y-H0,onMat=Math.abs(p.x)<HALF,was=contact;
  if(was){contact=feet<0&&onMat;if(!contact&&feet<0)over=true;}
  else{contact=!over&&feet<0&&feet>-0.25&&onMat;if(!contact&&feet<0)over=true;}
  if(contact){
    const d=-feet;let C=0.9;
    if(mode==='crash')C=8;else if(keys.KeyS)C=14;
    let acc=-G+K*d-C*p.vy;
    if(mode==='play'&&keys.KeyW){
      if(p.vy>0)acc+=130*d*Math.max(0,1-d/0.9)+5;
      if(Math.abs(p.vy)<0.6&&d<0.06)p.vy=Math.max(p.vy,3.2);
    }
    p.vy+=acc*dt;p.vx*=Math.exp(-8*dt);

    p.a+=p.L/inert(p)*dt;

    else if(p.twRate>0){
      if(p.twTarget===null)p.twTarget=Math.ceil(p.tw/Math.PI-1e-4)*Math.PI;
      p.tw+=Math.max(p.twRate,8)*dt;
      if(p.tw>=p.twTarget){p.tw=p.twTarget;p.twRate=0;p.twTarget=null;}
    }

    if(phase==='charge'){const bw=0.9*S;ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(X(p.x)-bw/2,Y(p.y+1.2),bw,4);ctx.fillStyle='#ffd166';ctx.fillRect(X(p.x)-bw/2,Y(p.y+1.2),bw*p.crouch,4);}
  }
  if(phase==='air'){
    const fl=(p.a-a0)/Math.PI,tw=(p.tw-tw0)/Math.PI,err=Math.min(Math.abs(wrap(p.a-Math.PI)),Math.abs(wrap(p.a)));
    const ok=err<0.6&&p.tuck<0.3;
    let s=`½-salt: ${Math.abs(fl).toFixed(1)}`;if(Math.abs(tw)>0.02)s+=` · ½-śrub: ${Math.abs(tw).toFixed(1)}`;
    txt(s,VW/2,VH-44,18,ok?'#9be7a7':'#ff8a8a','center',700);
  }
  const hint=phase==='air'?'A/D rotacja · LPM kuczka · S łamany · PPM śruba — do wody wchodź pionowo i otwarty':
    phase==='under'?'':`Trzymaj W: przysiad · puść: wybicie · A/D w przysiadzie: rotacja startowa · S: obrót na platformie${sub==='sync'?' · E: pokaz partnera':''} · R: reset`;
  txt(`${hint}${hint?' · ':''}M dźwięk ${muted?'wył.':'wł.'} · Esc menu`,VW/2,VH-16,12,'rgba(255,255,255,.8)','center',500);
  drawPops(VW/2,VH*0.36);
}
function render(){
  drawHall();drawDivers();
  ctx.fillStyle='rgba(220,240,255,.85)';
  for(const d of parts){ctx.globalAlpha=clamp(d.life/d.max,0,1)*0.9;ctx.beginPath();ctx.arc(X(d.x),Y(d.y),d.size*S,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  drawWater();
  if(flash>0){ctx.fillStyle=`rgba(255,80,80,${flash*0.4})`;ctx.fillRect(0,0,VW,VH);}
  drawHUD();drawResult();
}
return{enter,layout,step,update,render,onKey,onClick,get stars(){return stars;},LEVELS};
})();

/* ================= menu / overlay ================= */
const CTRL_T=`<table>
<tr><td><kbd>W</kbd></td><td>Odbicie — trzymaj na siatce, każde odbicie wyżej</td></tr>
<tr><td><kbd>S</kbd></td><td>Na siatce hamowanie, w powietrzu pozycja łamana</td></tr>
<tr><td><kbd>A</kbd> <kbd>D</kbd></td><td>Rotacja w lewo / w prawo (salta)</td></tr>
<tr><td><kbd>LPM</kbd></td><td>Kuczka (trzymaj) — szybsza rotacja</td></tr>
<tr><td><kbd>PPM</kbd></td><td>Śruba — klik = pół obrotu</td></tr>
<tr><td>Mysz</td><td>Celownik lądowania na siatce</td></tr></table>`;
const CTRL_D=`<table>
<tr><td><kbd>W</kbd></td><td>Trzymaj — przysiad (siła wybicia), puść — skok</td></tr>
<tr><td><kbd>A</kbd> <kbd>D</kbd></td><td>W przysiadzie: rotacja startowa. W powietrzu: rotacja</td></tr>
<tr><td><kbd>S</kbd></td><td>Na platformie: obrót twarzą/tyłem do wody. W powietrzu: pozycja łamana</td></tr>
<tr><td><kbd>LPM</kbd> <kbd>PPM</kbd></td><td>Kuczka / śruba</td></tr>
<tr><td><kbd>E</kbd> <kbd>R</kbd></td><td>Pokaz partnera (synchro) / reset skoku</td></tr></table>`;
function ovShow(html){panel.innerHTML=html;ov.style.display='flex';paused=true;clearInput();}
function ovHide(){ov.style.display='none';paused=false;screen='play';clearInput();last=performance.now();}
function showMenu(){
  screen='menu';const st=Dive.stars,done=st.filter(s=>s>0).length;
  ovShow(`<h1>Skoki i fikoły</h1><p class="sub">Wybierz tryb. Esc w trakcie gry — pauza i powrót tutaj.</p>
  <button class="mb" data-act="tramp"><b>Trampolina</b><span>Wolna jazda: salta, śruby, combo, rekord wysokości</span></button>
  <button class="mb" data-act="free"><b>Skoki do wody — freestyle</b><span>Wieża 10 m, dowolne skoki, 7 sędziów × współczynnik trudności</span></button>
  <button class="mb" data-act="sync"><b>Skoki do wody — synchro</b><span>50 poziomów: powtórz skok partnera i trzymaj synchronizację (${done}/50 zaliczonych)</span></button>
  <h2>Trampolina</h2>${CTRL_T}<h2>Skoki do wody</h2>${CTRL_D}
  <p class="note">Do wody wchodzi się pionowo — głową (nieparzysta liczba półsalt) albo nogami (parzysta) — w pozycji otwartej. Ocena: 7 sędziów, odrzucane 2 najwyższe i 2 najniższe noty, suma 3 pozostałych × współczynnik trudności (WT). WT w grze jest uproszczony, nie pochodzi z tabeli World Aquatics. <kbd>M</kbd> — dźwięk.</p>`);
}
function showLevels(){
  screen='levels';const st=Dive.stars;
  let html=`<h1>Synchro — 50 poziomów</h1><p class="sub">Niebieski partner skacze razem z tobą. Powtórz kierunek, liczbę salt i śrub, pozycję i tempo. Następny poziom odblokowuje się po zaliczeniu poprzedniego.</p><div class="grid">`;
  Dive.LEVELS.forEach((l,i)=>{const lock=i>0&&!st[i-1]&&!st[i];
    html+=`<button class="lv" data-act="lv" data-lv="${i+1}" ${lock?'disabled':''} title="${l.name}">${i+1}<small>${l.code==='—'?'nogami':l.code}</small><span class="st">${lock?'🔒':'★'.repeat(st[i])+'☆'.repeat(3-st[i])}</span></button>`;});
  html+=`</div><button class="mb" data-act="menu" style="margin-top:16px;text-align:center">← Menu</button>`;
  ovShow(html);
}
function showPause(){
  screen='pause';
  ovShow(`<h1>Pauza</h1><button class="primary" data-act="resume">Graj dalej</button>
  <div class="row"><button class="mb" data-act="menu">Menu główne</button>${game===Dive?'<button class="mb" data-act="levels">Lista poziomów</button>':''}</div>
  <h2>Sterowanie</h2>${game===Tramp?CTRL_T:CTRL_D}`);
}
function resume(){ovHide();}
panel.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ac();
  const a=b.dataset.act;
  if(a==='tramp'){game=Tramp;Tramp.enter();ovHide();}
  else if(a==='free'){game=Dive;Dive.enter('free');ovHide();}
  else if(a==='sync'||a==='levels')showLevels();
  else if(a==='lv'){game=Dive;Dive.enter('sync',+b.dataset.lv);ovHide();}
  else if(a==='menu')showMenu();
  else if(a==='resume')resume();
});

/* ================= loop ================= */
game=Tramp;Tramp.enter();showMenu();
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  game.layout();
  if(!paused){const n=8;for(let i=0;i<n;i++)game.step(dt/n);game.update(dt);}
  game.render(paused?0:dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
